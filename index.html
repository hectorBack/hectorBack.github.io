<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Héctor Salvador Servín Pérez - Portafolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-gray-100 font-sans antialiased">

    <div id="hero-component"></div>
    <div id="about-component"></div>
    <div id="skills-component"></div>
    <div id="projects-component"></div>
    <div id="footer-component"></div>

    <script>
        async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById(elementId).innerHTML = html;
                }
            } catch (error) {
                console.error(`Error al cargar ${filePath}:`, error);
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await loadComponent('hero-component', 'components/hero.txt');
            await loadComponent('about-component', 'components/about.txt');
            await loadComponent('skills-component', 'components/skills.txt');
            await loadComponent('projects-component', 'components/projects.txt');
            await loadComponent('footer-component', 'components/footer.txt');
        });
    </script>

    <div id="imageModal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-opacity duration-300"
        onclick="closeModal()">
        <div class="relative max-w-4xl w-full mx-auto" onclick="event.stopPropagation()">
            <button onclick="closeModal()"
                class="absolute -top-10 right-0 text-white text-3xl font-bold hover:text-indigo-400 transition-colors">&times;</button>

            <img id="modalImage" src="" alt="Previsualización"
                class="w-full max-h-[85vh] object-contain rounded-lg shadow-2xl border border-gray-700">

            <p id="modalCaption" class="text-center text-gray-300 text-sm mt-3 font-medium"></p>
        </div>
    </div>

    <script>
        function openModal(imageSrc, captionText) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const caption = document.getElementById('modalCaption');

            modalImg.src = imageSrc;
            caption.innerText = captionText;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Deshabilita el scroll de fondo
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto'; // Reactiva el scroll de fondo
        }

        // Permitir cerrar el modal al presionar la tecla ESC
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>

</html>
